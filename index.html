<style>

// Shuffle questions ONCE. This creates one fixed random order for this test.
// No question can repeat.
const quiz=source.slice().sort(()=>Math.random()-0.5);

// Shuffle options ONCE for each question.
// The saved order never changes when moving backward/forward.
const orders=quiz.map(()=>[0,1,2,3].sort(()=>Math.random()-0.5));

// Saved answer for every question.
// null = unanswered; 0-3 = original source option selected.
const saved=new Array(quiz.length).fill(null);

let cur=0,correct=0,wrong=0,locked=false;

function render(){
    const q=quiz[cur], order=orders[cur], selected=saved[cur];

    document.getElementById("q").textContent=
        "Question "+(cur+1)+" / 100\n\n"+q.q;

    const box=document.getElementById("opts");
    box.innerHTML="";

    const msg=document.getElementById("msg");
    msg.style.display="none";
    msg.className="";

    order.forEach((original,pos)=>{
        const b=document.createElement("button");
        b.className="a";
        b.textContent=String.fromCharCode(65+pos)+". "+q.o[original];

        if(selected!==null){
            b.disabled=true;

            // Show saved selected answer.
            if(original===selected){
                b.classList.add(selected===q.a ? "green" : "red");
            }

            // If saved answer was wrong, also show correct answer.
            if(selected!==q.a && original===q.a){
                b.classList.add("green");
            }

            if(original!==selected && !(selected!==q.a && original===q.a)){
                b.classList.add("dim");
            }
        }else{
            b.onclick=()=>choose(original);
        }

        box.appendChild(b);
    });

    if(selected!==null){
        if(selected===q.a){
            msg.className="g";
            msg.textContent="✓ Correct! Your answer is saved.";
        }else{
            const cp=order.indexOf(q.a);
            msg.className="r";
            msg.textContent="✗ Wrong! Correct answer: "+
                String.fromCharCode(65+cp)+". "+q.o[q.a]+
                "  (Your answer is saved.)";
        }
        msg.style.display="block";
    }

    document.getElementById("stats").textContent=
        "Question "+(cur+1)+" / 100   |   Correct: "+correct+
        "   |   Wrong: "+wrong;

    document.getElementById("prev").disabled=(cur===0);
}

function choose(original){
    if(locked || saved[cur]!==null)return;

    locked=true;
    saved[cur]=original;

    if(original===quiz[cur].a) correct++;
    else wrong++;

    render();

    // Show result first, then automatically move forward.
    setTimeout(()=>{
        locked=false;
        if(cur<quiz.length-1){
            cur++;
            render();
            window.scrollTo(0,0);
        }else{
            showFinal();
        }
    },1200);
}

document.getElementById("next").onclick=function(){
    if(locked)return;

    if(cur<quiz.length-1){
        cur++;
        render();
        window.scrollTo(0,0);
    }else{
        showFinal();
    }
};

document.getElementById("prev").onclick=function(){
    if(locked)return;

    if(cur>0){
        cur--;
        render();
        window.scrollTo(0,0);
    }
};

function showFinal(){
    document.getElementById("finish").style.display="block";

    const percent=Math.round((correct/quiz.length)*100);

    let html="<div class='score'><h2>🎉 Test Complete!</h2>"+
        "<h2>"+percent+"% Correct</h2>"+
        "<p>Correct: <b>"+correct+"</b> / 100</p>"+
        "<p>Wrong: <b>"+wrong+"</b> / 100</p></div>";

    if(wrong>0){
        html+="<h2>❌ Questions You Got Wrong</h2>";

        quiz.forEach((q,i)=>{
            if(saved[i]!==null && saved[i]!==q.a){
                const order=orders[i];
                const pickedPos=order.indexOf(saved[i]);
                const correctPos=order.indexOf(q.a);

                html+="<div class='result'>"+
                    "<b>Question "+(i+1)+":</b> "+q.q+
                    "<p class='picked'><b>You picked:</b> "+
                    String.fromCharCode(65+pickedPos)+". "+q.o[saved[i]]+"</p>"+
                    "<p class='correct'><b>Correct answer:</b> "+
                    String.fromCharCode(65+correctPos)+". "+q.o[q.a]+"</p>"+
                    "</div>";
            }
        });
    }else{
        html+="<div class='result'><b>🔥 Perfect score! You got every question correct.</b></div>";
    }

    document.getElementById("finish").innerHTML=html;
    document.getElementById("finish").scrollIntoView({behavior:"smooth"});
}

render();
</script></body></html>
